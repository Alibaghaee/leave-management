version: '3.7'
services:
  leave_management_system_master_server:
    container_name: leave_management_system_master_server
    restart: on-failure
    build:
      context: ./
      dockerfile: Dockerfile
    command: sh -c "composer dump-autoload && php artisan optimize:clear && php artisan storage:link && php artisan serve --host=0.0.0.0"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - db

  db:
    container_name: leave_management_system_master_server_db
    image: mysql:latest
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
    #            MYSQL_USER: root
    #            MYSQL_PASSWORD: root
    #            MYSQL_ROOT_PASSWORD: root
    ports:
      - "0.0.0.0:3306:33060"
    volumes:
      - .mydb:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      UPLOAD_LIMIT: 100000000


networks:
  default:
    external:
      name: leave_management_master

